name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Falls through to engines.node, so the supported version is written
          # down once, in package.json, and CI cannot drift from it.
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # One command, and the same one contributors run locally, so the two
      # cannot disagree about what passing means.
      - run: npm run ci

      # `npm run check:privacy` above proves the guard passes on a clean tree.
      # This proves it fails on a dirty one, which is the half that matters and
      # the half nothing else exercises: it reads what git is holding, so a
      # staged manifest is the only way to reach that code at all.
      - name: the privacy guard blocks a staged manifest
        run: |
          npm run build:manifest -- --dir metadata/example
          git add -f src/generated/manifest.ts
          if npm run check:privacy; then
            echo "::error::check:privacy passed on a staged manifest full of metadata"
            exit 1
          fi
          git restore --staged --worktree src/generated/manifest.ts
