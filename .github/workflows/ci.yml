name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # package.json is the only place a Node version is written down. Reading the
  # floor out of `engines` here means bumping that field is enough, and the
  # matrix cannot quietly drift from the range we promise to support.
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - id: read
        run: |
          set -euo pipefail
          # Takes the first version in the range, so ">=22.18.0" and
          # ">=22.18.0 <25" both give 22.18.0. Fails loudly rather than
          # testing some other version by accident.
          floor=$(jq -er '.engines.node | capture("(?<v>[0-9]+(\\.[0-9]+)*)").v' package.json)
          echo "engines floor: $floor"
          # The floor we promise, the release most people run, and the newest,
          # since running TypeScript without a flag is still changing.
          echo "matrix=[\"$floor\", \"lts/*\", \"current\"]" >> "$GITHUB_OUTPUT"

  check:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: no unrevealed metadata in git
        run: npm run check:privacy

      - name: lint and format
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

  worker:
    # Every test runs on Node, so this is the only thing that notices when
    # shared code under src/ picks up an API Cloudflare Workers cannot provide.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: bundles as a cloudflare worker
        run: npm run check:worker
