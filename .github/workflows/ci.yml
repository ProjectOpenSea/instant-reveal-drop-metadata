name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from package.json engines, where Node started running
        # TypeScript without a flag, and current. The whole repo depends on
        # that behaviour, so it is worth testing both ends.
        node: ["22.18", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: no unrevealed metadata in git
        run: npm run check:privacy

      - name: format
        run: npm run format:check

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

  worker:
    # Every test runs on Node, so this is the only thing that notices when
    # shared code under src/ picks up an API Cloudflare Workers cannot provide.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: bundles as a cloudflare worker
        run: npm run check:worker
