name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # engines.node is a range, and `node-version-file: package.json` resolves
      # a range to the newest release that satisfies it. That tests the opposite
      # of what matters: the README tells creators to install the floor, so a
      # change that breaks the floor breaks the documented setup, and it would
      # still pass CI on whatever Node shipped last week.
      #
      # Reading the floor out of package.json rather than writing it here keeps
      # one source of truth, so bumping engines.node moves CI with it.
      - id: node
        run: |
          set -euo pipefail
          floor="$(jq -er '.engines.node | ltrimstr(">=")' package.json)"
          case "$floor" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "engines.node is not a >=x.y.z floor: $floor" >&2; exit 1 ;;
          esac
          echo "floor=$floor" >> "$GITHUB_OUTPUT"
          echo "Testing on the minimum supported Node: $floor"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.floor }}
          cache: npm

      - run: npm ci

      # One command, and the same one contributors run locally, so the two
      # cannot disagree about what passing means.
      - run: npm run ci
